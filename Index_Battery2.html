            user-select: none;
            -webkit-user-select: none;

        #viewport {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            will-change: transform, filter;
        }

        #battery-body {
            position: relative;
            width: 120px;
            height: 240px;
            border: 8px solid #a3a3a3;
            border-radius: 24px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-color: rgba(0,0,0,0.3);
            z-index: 10;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #battery-nub {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 16px;
            background-color: #a3a3a3;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            transition: background-color 0.3s;

            width: 100%;
            height: 50%;

            background-color: #22c55e;
            transition: height 0.1s ease-out, background-color 0.2s;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.2);
            will-change: height, background-color;
        }

        /* Interaction feedback */
        .action-btn {
            touch-action: manipulation;
            transition: transform 0.05s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;

        .action-btn:active, .action-btn.is-pressed {

            inset: 0;
            pointer-events: none;

<body style="-webkit-tap-highlight-color: transparent; user-select: none; height: 100%; overscroll-behavior: contain;">

    <!-- Hidden audio for unlock requirement (Procedural logic used inside) -->
    <audio id="sfx-beep" preload="auto"></audio>
    <!-- sekai audio slots -->
    <!-- // sekai-slot: sfx:electric-zap-shock desc="electric zap shock burst" -->
    <!-- // sekai-slot: sfx:digital-beep-up desc="digital beep rising tone" -->
    <!-- // sekai-slot: sfx:digital-beep-down desc="digital beep falling tone" -->

    <div id="viewport" style="transform: translate(11.2639px, 39.1882px) rotate(-0.488587deg);" class="glitch-fx">
        <!-- Overlay Canvas for Sparks -->
        <canvas id="effects-canvas" width="956" height="376"></canvas>
        
        <!-- Screen Flash Overlay -->
        <div id="flash-overlay" class="flash-active"></div>

        <!-- Text Message (Top) -->
        <div id="message-display" class="text-2xl md:text-3xl text-center px-6 h-24 font-bold tracking-wide transition-colors flex items-center justify-center mb-4 uppercase drop-shadow-md" style="color: rgb(255, 255, 255);">im finished</div>

        <!-- Battery Visual -->
        <div id="battery-body" style="border-color: rgb(159, 18, 57); box-shadow: rgb(159, 18, 57) 0px 0px 50px;">
            <div id="battery-nub" style="background-color: rgb(159, 18, 57);"></div>
            <div id="battery-fill" style="height: 100%; background-color: rgb(159, 18, 57);"></div>
        </div>

        <!-- Percentage -->
        <div id="percentage-display" class="text-7xl font-black mt-8 mb-6 font-mono tracking-tighter drop-shadow-lg" style="color: rgb(255, 255, 255); text-shadow: rgb(159, 18, 57) 0px 0px 15px;">690%</div>

        <!-- Controls -->
        <div class="flex items-center gap-4 mt-2 z-40">
            <button id="btn-minus-10" class="action-btn w-16 h-16 rounded-full bg-red-700 text-white text-xl font-black flex items-center justify-center shadow-[0_6px_0_rgb(127,29,29)] active:shadow-[0_0px_0_rgb(127,29,29)] active:translate-y-1.5" title="Minus 10%">
                -10
            </button>
            <button id="btn-minus" class="action-btn w-24 h-24 rounded-full bg-red-500 text-white text-5xl font-bold flex items-center justify-center shadow-[0_8px_0_rgb(185,28,28)] active:shadow-[0_0px_0_rgb(185,28,28)] active:translate-y-2" title="Minus 1%">
                <i class="fas fa-minus pointer-events-none"></i>
            </button>
            <button id="btn-plus" class="action-btn w-24 h-24 rounded-full bg-green-500 text-white text-5xl font-bold flex items-center justify-center shadow-[0_8px_0_rgb(21,128,61)] active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-2" title="Plus 1%">
                <i class="fas fa-plus pointer-events-none"></i>
            </button>
            <button id="btn-plus-10" class="action-btn w-16 h-16 rounded-full bg-green-700 text-white text-xl font-black flex items-center justify-center shadow-[0_6px_0_rgb(20,83,45)] active:shadow-[0_0px_0_rgb(20,83,45)] active:translate-y-1.5" title="Plus 10%">
                +10
            </button>
        </div>

        <!-- GitHub Repo / HTML Export Tools -->
        
        
    </div>

<script>
    //#region @sekai:state · Battery state and Sekai debug contract
    /**
     * SEKAI EDITABLE METADATA
     */
    

    /**
     * STATE MANAGEMENT
     */
    window.appState = {
        level: 50
    };

    /**
     * SEKAI CONTRACT & DEBUG
     */
    window.sekaiContract = {
        version: '1.0.0',
        interactable: [
            { id: 'btn-minus-10', type: 'button', label: '-10%' },
            { id: 'btn-minus', type: 'button', label: '-1%' },
            { id: 'btn-plus', type: 'button', label: '+1%' },
            { id: 'btn-plus-10', type: 'button', label: '+10%' },
            { id: 'btn-copy-html', type: 'button', label: 'Copy HTML' },
            { id: 'btn-download-html', type: 'button', label: 'Download HTML' }
        ]
    };

    window.sekaiDebug = {
        state: function() {
            return {
                name: 'Battery Simulator',
                level: window.appState.level,
                status: getBatteryState(window.appState.level).msg
            };
        },
        reset: function() {
            window.appState.level = 50;
            updateUI();
        }
    };
    //#endregion @sekai:state

    /**
     * DOM ELEMENTS
     */
    const elements = {
        viewport: document.getElementById('viewport'),
        batteryBody: document.getElementById('battery-body'),
        batteryNub: document.getElementById('battery-nub'),
        batteryFill: document.getElementById('battery-fill'),
        percentageDisplay: document.getElementById('percentage-display'),
        messageDisplay: document.getElementById('message-display'),
        btnMinus10: document.getElementById('btn-minus-10'),
        btnMinus: document.getElementById('btn-minus'),
        btnPlus: document.getElementById('btn-plus'),
        btnPlus10: document.getElementById('btn-plus-10'),
        effectsCanvas: document.getElementById('effects-canvas'),
        flashOverlay: document.getElementById('flash-overlay'),
        btnCopyHtml: document.getElementById('btn-copy-html'),
        btnDownloadHtml: document.getElementById('btn-download-html'),
        copyBtnText: document.getElementById('copy-btn-text'),
        exportToast: document.getElementById('export-toast')
    };

    // Interaction state
    let particles = [];
    let holdTimeout = null;
    let holdInterval = null;
    let holdTicks = 0;
    let currentShakeIntensity = 0;
    let audioCtx = null;

    /**
     * HTML EXPORT (FOR GITHUB REPOSITORY)
     */
    //#region @sekai:export · Exact HTML copy and download actions
    function getExactSourceHtml() {
        const clone = document.documentElement.cloneNode(true);
        // Strip the entire export buttons container, individual buttons, and toast
        clone.querySelector('#btn-copy-html')?.closest('.flex.items-center.gap-3')?.remove();
        clone.querySelector('#btn-download-html')?.closest('.flex.items-center.gap-3')?.remove();
        clone.querySelector('#btn-copy-html')?.remove();
        clone.querySelector('#btn-download-html')?.remove();
        clone.querySelector('#export-toast')?.remove();
        return '<!DOCTYPE html>\n' + clone.outerHTML;
    }

    function showExportToast(msg) {
        if (!elements.exportToast) return;
        elements.exportToast.textContent = msg;
        elements.exportToast.classList.remove('opacity-0');
        elements.exportToast.classList.add('opacity-100');
        setTimeout(() => {
            elements.exportToast.classList.remove('opacity-100');
            elements.exportToast.classList.add('opacity-0');
        }, 2500);
    }

    async function copyExactHtml() {
        const html = getExactSourceHtml();
        let copied = false;

        // First try navigator.clipboard API if available
        if (navigator.clipboard && window.isSecureContext) {
            try {
                await navigator.clipboard.writeText(html);
                copied = true;
            } catch (clipErr) {
                // Fallback to execCommand on permission/security restriction (e.g. in iframe)
                copied = false;
            }
        }

        // Fallback using textarea + execCommand
        if (!copied) {
            try {
                const ta = document.createElement('textarea');
                ta.value = html;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '0';
                ta.style.left = '0';
                ta.style.width = '2em';
                ta.style.height = '2em';
                ta.style.padding = '0';
                ta.style.border = 'none';
                ta.style.outline = 'none';
                ta.style.boxShadow = 'none';
                ta.style.background = 'transparent';
                ta.style.opacity = '0.01';
                ta.style.zIndex = '-9999';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0, html.length);
                copied = document.execCommand('copy');
                document.body.removeChild(ta);
            } catch (execErr) {
                copied = false;
            }
        }

        try {
            if (!copied) {
                throw new Error('Copy command failed');
            }
            if (elements.copyBtnText) elements.copyBtnText.textContent = 'Copied!';
            showExportToast('Copied exact HTML to clipboard!');
            setTimeout(() => {
                if (elements.copyBtnText) elements.copyBtnText.textContent = 'Copy HTML';
            }, 2000);
        } catch (err) {
            showExportToast('Failed to copy. Please try download instead.');
        }
    }

    async function downloadExactHtml() {
        const html = getExactSourceHtml();
        try {
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showExportToast('Downloaded index.html for repository!');
        } catch (err) {
            showExportToast('Download failed.');
        }
    }
    //#endregion @sekai:export

    /**
     * AUDIO SYSTEM
     */
    //#region @sekai:audio · Slot-backed sound effects with synth fallbacks
    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn('Web Audio API not supported');
            }
        }
    }

    function playElectricZap() {
        initAudio();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        try {
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const subOsc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(2200, audioCtx.currentTime + 0.08);
            osc1.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.3);

            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(240, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(3600, audioCtx.currentTime + 0.06);
            osc2.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.35);

            // Sub-thump punch for satisfying impact
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(180, audioCtx.currentTime);
            subOsc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.25);

            gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            subOsc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
            subOsc.start();
            osc1.stop(audioCtx.currentTime + 0.42);
            osc2.stop(audioCtx.currentTime + 0.42);
            subOsc.stop(audioCtx.currentTime + 0.42);

            // Trigger haptic feedback if available
            if (typeof navigator !== 'undefined' && navigator.vibrate) {
                navigator.vibrate([40, 20, 80]);
            }
        } catch (e) {
            console.warn("Zap sound failed", e);
        }
    }

    function createSparks(x, y, count) {
        for (let i = 0; i < count; i++) {
            const angle = (Math.random() * Math.PI) + Math.PI; // Upwards hemisphere
            const speed = 2 + Math.random() * 12;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                life: 1.0,
                decay: 0.015 + Math.random() * 0.03,
                color: Math.random() > 0.4 ? '#60a5fa' : '#38bdf8'
            });
        }
    }

    function trigger101Effect() {
        // Trigger Screen Flash
        elements.flashOverlay.classList.remove('flash-active');
        void elements.flashOverlay.offsetWidth; // Force Reflow
        elements.flashOverlay.classList.add('flash-active');

        // Play Electric audio
        playElectricZap();

        // Emit high intensity sparks from battery nub
        if (elements.effectsCanvas) {
            const nubRect = elements.batteryNub.getBoundingClientRect();
            const canvasRect = elements.effectsCanvas.getBoundingClientRect();
            const x = (nubRect.left + nubRect.width / 2) - canvasRect.left;
            const y = (nubRect.top + nubRect.height / 2) - canvasRect.top;
            createSparks(x, y, 45);
        }
    }

    function playProceduralBeep(level, isPlus) {
        initAudio();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        try {
            const t = audioCtx.currentTime;
            const oscPrimary = audioCtx.createOscillator();
            const oscHarmonic = audioCtx.createOscillator();
            const clickOsc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const clickGain = audioCtx.createGain();

            // Musical chromatic scale base note matching level
            const clampedLvl = Math.max(0, level);
            const semitone = clampedLvl % 24;
            const rootFreq = isPlus ? 330 : 260; // E4 or C4
            const noteFreq = rootFreq * Math.pow(2, semitone / 12);

            if (level >= 1000) {
                oscPrimary.type = 'sawtooth';
                oscHarmonic.type = 'square';
                oscPrimary.frequency.setValueAtTime(200 + Math.random() * 1500, t);
                oscHarmonic.frequency.setValueAtTime(300 + Math.random() * 2000, t);
            } else if (level > 100) {
                oscPrimary.type = level > 400 ? 'square' : 'sawtooth';
                oscHarmonic.type = 'sine';
                const overchargeFreq = Math.min(3000, noteFreq * (1 + (level - 100) * 0.015));
                oscPrimary.frequency.setValueAtTime(overchargeFreq, t);
                oscHarmonic.frequency.setValueAtTime(overchargeFreq * 1.5, t);
            } else {
                oscPrimary.type = 'sine';
                oscHarmonic.type = 'triangle';
                oscPrimary.frequency.setValueAtTime(noteFreq, t);
                const slideTarget = isPlus ? noteFreq * 1.15 : noteFreq * 0.85;
                oscPrimary.frequency.exponentialRampToValueAtTime(Math.max(40, slideTarget), t + 0.08);
                oscHarmonic.frequency.setValueAtTime(noteFreq * 2, t);
                oscHarmonic.frequency.exponentialRampToValueAtTime(Math.max(80, slideTarget * 2), t + 0.08);
            }

            // Punchy click transient for mechanical satisfying pop feel
            clickOsc.type = 'triangle';
            clickOsc.frequency.setValueAtTime(isPlus ? 1200 : 700, t);
            clickOsc.frequency.exponentialRampToValueAtTime(100, t + 0.015);
            clickGain.gain.setValueAtTime(0.2, t);
            clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.015);

            // Smooth, rich tone envelope
            gainNode.gain.setValueAtTime(0.001, t);
            gainNode.gain.linearRampToValueAtTime(0.22, t + 0.008);
            gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

            oscPrimary.connect(gainNode);
            oscHarmonic.connect(gainNode);
            clickOsc.connect(clickGain);
            gainNode.connect(audioCtx.destination);
            clickGain.connect(audioCtx.destination);

            oscPrimary.start(t);
            oscHarmonic.start(t);
            clickOsc.start(t);
            oscPrimary.stop(t + 0.1);
            oscHarmonic.stop(t + 0.1);
            clickOsc.stop(t + 0.02);
        } catch(e) {
            console.warn("Audio play failed", e);
        }
    }
    //#endregion @sekai:audio

    /**
     * GAME LOGIC & THRESHOLDS
     */
    //#region @sekai:logic · Battery thresholds and visual state updates
    function getBatteryState(level) {
        // User's exact requested thresholds and texts
        if (level === 0) return { msg: "dead", color: "#525252", textCol: "#a3a3a3", shake: 0 };
        if (level < 5) return { msg: "extremly less batterie", color: "#dc2626", textCol: "#ef4444", shake: 0 };
        if (level < 10) return { msg: "less batterie", color: "#ef4444", textCol: "#f87171", shake: 0 };
        if (level < 20) return { msg: "medium batterie", color: "#f97316", textCol: "#fdba74", shake: 0 };
        if (level < 40) return { msg: "extremly medium batterie", color: "#eab308", textCol: "#fde047", shake: 0 };
        if (level < 60) return { msg: "mid battery", color: "#facc15", textCol: "#fef08a", shake: 0 };
        if (level < 70) return { msg: "good batterie", color: "#a3e635", textCol: "#d9f99d", shake: 0 };
        if (level < 90) return { msg: "very Good batterie", color: "#4ade80", textCol: "#bbf7d0", shake: 0 };
        if (level < 100) return { msg: "very very Good batterie", color: "#22c55e", textCol: "#86efac", shake: 0 };
        if (level === 100) return { msg: "full charge", color: "#06b6d4", textCol: "#67e8f9", shake: 0, glow: "#06b6d4" };
        if (level < 120) return { msg: "wait how is this possible", color: "#3b82f6", textCol: "#93c5fd", shake: 2, glow: "#3b82f6" };
        if (level < 160) return { msg: "extremly shocking", color: "#8b5cf6", textCol: "#c4b5fd", shake: 4, glow: "#8b5cf6" };
        if (level < 200) return { msg: "noooooo stop thisss", color: "#d946ef", textCol: "#f0abfc", shake: 8, glow: "#d946ef" };
        if (level < 400) return { msg: "your killing meee", color: "#f43f5e", textCol: "#fda4af", shake: 15, glow: "#f43f5e" };
        if (level < 600) return { msg: "you are ending m'y life", color: "#e11d48", textCol: "#fff", shake: 25, glow: "#e11d48", invert: true };
        if (level < 1000) return { msg: "im finished", color: "#9f1239", textCol: "#fff", shake: 40, glow: "#9f1239", glitch: true };
        
        // 1000+
        return { msg: "ahhhhhhhhhhhhh stooooooppppppp nowwwwwwwwwwwwwwwwww", color: "#ffffff", textCol: "#ffffff", shake: 60, glow: "#ffffff", glitch: true, invert: Math.random() > 0.5 };
    }

    function updateUI() {
        const level = appState.level;
        const state = getBatteryState(level);
        
        // Update text
        elements.percentageDisplay.textContent = level + "%";
        elements.messageDisplay.textContent = state.msg;
        elements.messageDisplay.style.color = state.textCol;

        // Update battery visual
        const fillPercent = Math.min(level, 100);
        elements.batteryFill.style.height = `${fillPercent}%`;
        elements.batteryFill.style.backgroundColor = state.color;
        
        // Overcharge styling
        if (level > 100) {
            elements.batteryNub.style.backgroundColor = state.color;
            elements.batteryBody.style.borderColor = state.color;
            elements.batteryBody.style.boxShadow = `0 0 ${Math.min((level-100), 50)}px ${state.glow}`;
            elements.percentageDisplay.style.color = state.textCol;
            elements.percentageDisplay.style.textShadow = `0 0 15px ${state.glow}`;
        } else {
            elements.batteryNub.style.backgroundColor = '#a3a3a3';
            elements.batteryBody.style.borderColor = '#a3a3a3';
            elements.batteryBody.style.boxShadow = 'none';
            elements.percentageDisplay.style.color = 'var(--text-color)';
            elements.percentageDisplay.style.textShadow = 'none';
        }

        // Apply FX classes
        if (state.glitch) elements.viewport.classList.add('glitch-fx');
        else elements.viewport.classList.remove('glitch-fx');

        if (state.invert) elements.viewport.classList.add('invert-fx');
        else elements.viewport.classList.remove('invert-fx');

        // Update shake intensity for the render loop
        currentShakeIntensity = state.shake;
    }
    //#endregion @sekai:logic

    /**
     * INTERACTION HANDLING
     */
    //#region @sekai:input · Battery controls and hold-repeat handling
    function changeLevel(amount) {
        const oldLevel = appState.level;
        appState.level = Math.max(0, appState.level + amount);
        updateUI();
        
        // Trigger the 101% effect when transitioning upwards to or past 101
        if (oldLevel <= 100 && appState.level >= 101) {
            trigger101Effect();
        }
        
        playProceduralBeep(appState.level, amount > 0);
    }

    function startHold(direction) {
        // Initial press
        initAudio(); // Required for iOS to unlock context on first touch
        changeLevel(direction);
        holdTicks = 0;

        // Wait before auto-repeating
        holdTimeout = setTimeout(() => {
            holdInterval = setInterval(() => {
                holdTicks++;
                
                // Acceleration curve
                let amount = direction;
                if (holdTicks > 10) amount = direction * 3;
                if (holdTicks > 30) amount = direction * 10;
                if (holdTicks > 60) amount = direction * 50; // Super speed

                changeLevel(amount);
            }, 50); // Fast tick rate
        }, 400); // 400ms delay before repeating
    }

    function stopHold() {
        if (holdTimeout) clearTimeout(holdTimeout);
        if (holdInterval) clearInterval(holdInterval);
        holdTimeout = null;
        holdInterval = null;
    }

    // Event binding
    function bindButton(element, direction) {
        // Pointer down
        element.addEventListener('pointerdown', (e) => {
            e.preventDefault(); // Prevents default touch behaviors like zoom/scroll
            element.setPointerCapture(e.pointerId);
            element.classList.add('is-pressed');
            startHold(direction);
        });

        // Pointer up / leave / cancel
        ['pointerup', 'pointercancel'].forEach(evt => {
            element.addEventListener(evt, (e) => {
                element.classList.remove('is-pressed');
                if (element.hasPointerCapture(e.pointerId)) {
                    element.releasePointerCapture(e.pointerId);
                }
                stopHold();
            });
        });
    }
    //#endregion @sekai:input

    /**
     * RENDER LOOP (Screen Shake & Electric Sparks)
     */
    //#region @sekai:render · Frame loop, canvas particles, and resize
    function gameLoop() {
        // Screen shake logic
        if (currentShakeIntensity > 0) {
            const dx = (Math.random() - 0.5) * 2 * currentShakeIntensity;
            const dy = (Math.random() - 0.5) * 2 * currentShakeIntensity;
            const rotation = (Math.random() - 0.5) * (currentShakeIntensity * 0.1);
            elements.viewport.style.transform = `translate(${dx}px, ${dy}px) rotate(${rotation}deg)`;
        } else {
            elements.viewport.style.transform = 'translate(0px, 0px) rotate(0deg)';
        }

        // Emit ambient sparks continuously when battery is at 101% or greater
        if (appState.level >= 101 && elements.effectsCanvas && Math.random() < 0.25) {
            const nubRect = elements.batteryNub.getBoundingClientRect();
            const canvasRect = elements.effectsCanvas.getBoundingClientRect();
            const x = (nubRect.left + nubRect.width / 2) - canvasRect.left;
            const y = (nubRect.top + nubRect.height / 2) - canvasRect.top;
            createSparks(x, y, 2);
        }

        // Draw and update particle sparks
        updateParticles();
        
        requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
        const canvas = elements.effectsCanvas;
        if (!canvas) return;
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }

    function updateParticles() {
        const canvas = elements.effectsCanvas;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25; // gravity pulls sparks down
            p.life -= p.decay;

            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, 1.5 + p.life * 3, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
    }
    //#endregion @sekai:render

    /**
     * INITIALIZATION
     */
    //#region @sekai:init · Editable setup and app initialization
    function applyAllEditableValues() {
        window.sekaiEditable.tune?.forEach(t => {
            if (t.path) setNestedValue(window, t.path, t.value);
        });
        window.sekaiEditable.colors?.forEach(c => {
            if (c.cssVar) document.documentElement.style.setProperty(c.cssVar, c.value);
        });
        window.sekaiEditable.text?.forEach(t => {
            if (t.selector) {
                const el = document.querySelector(t.selector);
                if (el) el.textContent = t.value;
            }
        });
    }

    // Helper for editing API
    function setNestedValue(obj, path, value) {
        const parts = path.split('.');
        let current = obj;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!current[parts[i]]) current[parts[i]] = {};
            current = current[parts[i]];
        }
        current[parts[parts.length - 1]] = value;
    }

    function getConfig(category, id, fallback) {
        const found = window.sekaiEditable?.[category]?.find(i => i.id === id)?.value;
        return (found !== undefined && found !== null && found !== '') ? found : fallback;
    }

    function initApp() {
        applyAllEditableValues();
        if (window.sekaiEditable?.tune) {
            const initLvl = getConfig('tune', 'initial_level', 50);
            window.appState.level = initLvl;
        }
        
        // Prevent context menu on long press
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Bind inputs
        bindButton(elements.btnMinus10, -10);
        bindButton(elements.btnMinus, -1);
        bindButton(elements.btnPlus, 1);
        bindButton(elements.btnPlus10, 10);

        // Bind export buttons
        if (elements.btnCopyHtml) {
            elements.btnCopyHtml.addEventListener('click', (e) => {
                copyExactHtml();
            });
        }
        if (elements.btnDownloadHtml) {
            elements.btnDownloadHtml.addEventListener('click', (e) => {
                downloadExactHtml();
            });
        }

        // Initialize and listen to Canvas resizing
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // First UI paint
        updateUI();

        // Start render loop
        requestAnimationFrame(gameLoop);
    }

    document.addEventListener('DOMContentLoaded', initApp);
    //#endregion @sekai:init

    /**
     * SEKAI PREVIEW EDITING API
     */
    //#region @sekai:preview-api · Preview editor message handlers
    (function setupPreviewEditingAPI() {
        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (msg?.origin !== 'sekai_gaming_iframe_api') return;

            switch (msg.type) {
                case 'get_editable_metadata':
                    window.parent.postMessage({
                        origin: 'sekai_gaming_iframe_api',
                        type: 'receive_editable_metadata',
                        taskId: msg.taskId,
                        data: window.sekaiEditable || {}
                    }, '*');
                    break;
                case 'apply_change':
                    const success = applySingleChange(msg.data.id, msg.data.value, msg.data.name, msg.data.description);
                    // Force UI update on state change
                    updateUI();
                    window.parent.postMessage({
                        origin: 'sekai_gaming_iframe_api',
                        type: 'receive_apply_change',
                        taskId: msg.taskId,
                        data: { success }
                    }, '*');
                    break;
                case 'get_current_html':
                    window.parent.postMessage({
                        origin: 'sekai_gaming_iframe_api',
                        type: 'receive_current_html',
                        taskId: msg.taskId,
                        data: { html: document.documentElement.outerHTML }
                    }, '*');
                    break;
                case 'reset_changes':
                    location.reload();
                    break;
            }
        });

        function applySingleChange(id, value, name, description) {
            const categories = ['tune', 'images', 'videos', 'music', 'sfx', 'colors', 'text', 'prompts', 'voices', 'fonts', 'models'];
            for (const cat of categories) {
                const item = window.sekaiEditable[cat]?.find(i => i.id === id);
                if (!item) continue;

                item.value = value;
                if (name) item.name = name;
                if (description) item.description = description;

                if (item.cssVar) {
                    document.documentElement.style.setProperty(item.cssVar, value);
                } else if (item.path) {
                    setNestedValue(window, item.path, value);
                } else if (item.selector) {
                    const el = document.querySelector(item.selector);
                    if (!el) return false;
                    
                    if (el.tagName === 'AUDIO') {
                        const wasPlaying = !el.paused;
                        el.src = value;
                        el.load();
                        if (wasPlaying) el.play().catch(() => {});
                    } else if (item.property === 'src') {
                        el.src = value;
                    } else if (item.property === 'backgroundImage') {
                        el.style.backgroundImage = `url('${value}')`;
                    } else {
                        el.textContent = value;
                    }
                }
                return true;
            }
            return false;
        }
    })();
    //#endregion @sekai:preview-api
</script>
